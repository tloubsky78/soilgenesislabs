name: Sync site content

on:
  push:
    branches:
      - main
    paths:
      - "site-content.json"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Synchronize site-content.json into index.html
        run: node sync-site-content.mjs site-content.json index.html

      - name: Commit synchronized index.html
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html
          git commit -m "Sync index.html from site-content.json"
          git push
